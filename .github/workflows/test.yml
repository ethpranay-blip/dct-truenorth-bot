name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches Railway's runtime
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile bot.py
      - run: python -m pytest -q
      - name: no simple moving averages in the engine
        run: "! grep -q sma bot.py"
